# Example scrape configuration. Prometheus must reach the app on the private network: either run it on the
# `alpha_default` Docker network (target app:3001) or through Caddy from a private address.
global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: alpha
    metrics_path: /api/system/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/alpha-metrics-token   # contains METRICS_TOKEN
    static_configs:
      - targets: ["app:3001"]
