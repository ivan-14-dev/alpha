# clamd configuration for Alpha (mounted read-only over the image default /etc/clamav/clamd.conf).
# Same base settings as clamav/clamav:stable, plus size limits that cover the 200 MB campaign builds
# accepted by the files module (clamd defaults to 100 MB per stream, larger uploads would never be scanned).
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

StreamMaxLength 260M
MaxFileSize 260M
MaxScanSize 1024M
# Scanning a large archive can take a while; the app waits up to CLAMAV_TIMEOUT_MS (120 s recommended).
ReadTimeout 180
CommandReadTimeout 180
